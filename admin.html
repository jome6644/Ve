<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vezxoxo | Applications</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #0b0b0d; color: #f7f1e7; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px max(18px,4vw); background:#111114; border-bottom:1px solid #27272c; position:sticky; top:0; z-index:10; }
    .brand { font-family:Georgia,serif; text-transform:lowercase; letter-spacing:4px; color:#e4ba64; font-size:22px; }
    .topbar h1 { margin:5px 0 0; font-size:25px; }
    .actions { display:flex; align-items:center; gap:12px; }
    button { border:0; border-radius:10px; padding:11px 15px; cursor:pointer; font-weight:700; }
    .gold { background:#e4ba64; color:#17120a; }
    .dark { background:#242429; color:#eee; }
    .login { width:min(420px,92%); margin:12vh auto; padding:30px; background:#141417; border:1px solid #2d2d32; border-radius:20px; box-shadow:0 25px 80px rgba(0,0,0,.35); }
    .login h1 { margin:10px 0 22px; }
    .login label { display:block; margin-bottom:8px; color:#d7d1c7; }
    .login input { width:100%; border:1px solid #39393f; background:#0f0f12; color:white; border-radius:10px; padding:13px; outline:none; }
    .login button { width:100%; margin-top:14px; }
    #dashboard { display:none; }
    .content { width:min(1200px,94%); margin:28px auto 60px; }
    .meta { color:#96969f; font-size:13px; }
    .card { border:1px solid #2a2a30; background:#131316; border-radius:18px; overflow:hidden; margin-bottom:20px; }
    .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:18px 20px; border-bottom:1px solid #28282d; }
    .card-head h2 { margin:0 0 6px; font-size:21px; }
    .id { color:#e4ba64; font-size:12px; word-break:break-all; text-align:right; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:#29292e; }
    .detail { background:#151518; padding:15px; min-width:0; }
    .detail span { display:block; color:#92929c; font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
    .detail strong { display:block; font-size:14px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
    .message { padding:16px; border-radius:12px; background:#351818; border:1px solid #622828; color:#ffdede; margin-top:14px; display:none; }
    .empty { text-align:center; color:#8f8f98; padding:55px 20px; border:1px dashed #36363c; border-radius:16px; }
    @media (max-width:720px) { .topbar{align-items:flex-start;flex-direction:column}.details{grid-template-columns:1fr}.actions{width:100%;justify-content:space-between} }
  </style>
</head>
<body>
  <main id="loginView" class="login">
    <div class="brand">vezxoxo</div>
    <h1>Admin Login</h1>
    <form id="loginForm">
      <label>Admin Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button class="gold" type="submit">Open Dashboard</button>
      <div id="loginError" class="message"></div>
    </form>
  </main>

  <section id="dashboard">
    <header class="topbar">
      <div><div class="brand">vezxoxo</div><h1>Applications</h1></div>
      <div class="actions"><span id="count" class="meta"></span><button id="refresh" class="dark" type="button">Refresh</button><button id="logout" class="gold" type="button">Log Out</button></div>
    </header>
    <main class="content"><div id="loadError" class="message"></div><div id="cards"></div></main>
  </section>

  <script>
    const SUPABASE_URL = "https://sholxtmdddsxzynxyonb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VGD_MWxZ2cqJfmCbDtpSTg_R6ZtsxxX";
    const loginView=document.getElementById("loginView"),dashboard=document.getElementById("dashboard"),loginForm=document.getElementById("loginForm"),passwordInput=document.getElementById("password"),loginError=document.getElementById("loginError"),loadError=document.getElementById("loadError"),cards=document.getElementById("cards"),count=document.getElementById("count"),refreshButton=document.getElementById("refresh"),logoutButton=document.getElementById("logout");
    let adminPassword="";
    const labels=[["name","Name"],["age","Age"],["profession","Profession"],["marital_status","Marital Status"],["location","City / Country"],["email","Email"],["acting","Acting Skill"],["acting_notes","Acting Notes"],["ads","Advertisement Experience"],["ads_notes","Advertisement Notes"],["camera","Comfortable on Camera"],["script","Short Script Performance"],["preferred_products","Preferred Products"],["non_preferred_products","Non-Preferred Products"],["partial_exposure","Partial Body Exposure"],["partial_exposure_notes","Exposure Boundaries"],["provocative_outfits","Provocative / Revealing Outfits"],["no_face_nudity","No-Face Filming for Nudity"],["wardrobe","Wardrobe Restrictions"],["wardrobe_notes","Wardrobe Notes"],["romantic","Non-Explicit Romantic Scenes"],["travel","Travel for Shoots"],["project_types","Preferred Project Types"],["availability","Availability"],["expected_monthly_income","Expected Monthly Amount"],["additional_notes","Additional Notes"]];
    function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    async function loadApplications(){
      loadError.style.display="none";
      const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_submissions_admin`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},body:JSON.stringify({p_password:adminPassword})});
      if(!response.ok) throw new Error("Incorrect password or unable to load applications.");
      const items=await response.json(); renderApplications(Array.isArray(items)?items:[]);
    }
    function renderApplications(items){
      count.textContent=`${items.length} submissions`;
      if(items.length===0){cards.innerHTML='<div class="empty">No applications yet.</div>';return}
      cards.innerHTML=items.map(item=>{
        const detailHtml=labels.map(([key,label])=>{let value=item[key];if(Array.isArray(value))value=value.join(", ");return `<div class="detail"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`}).join("");
        return `<article class="card"><div class="card-head"><div><h2>${escapeHtml(item.name)}</h2><div class="meta">${escapeHtml(item.email)} · ${escapeHtml(new Date(item.created_at).toLocaleString())}</div></div><div class="id">${escapeHtml(item.id)}</div></div><div class="details">${detailHtml}</div></article>`
      }).join("");
    }
    loginForm.addEventListener("submit",async e=>{e.preventDefault();adminPassword=passwordInput.value;try{await loadApplications();loginView.style.display="none";dashboard.style.display="block";loginError.style.display="none"}catch{loginError.textContent="Incorrect password or unable to load applications.";loginError.style.display="block"}});
    refreshButton.addEventListener("click",async()=>{try{await loadApplications()}catch{loadError.textContent="Unable to refresh applications.";loadError.style.display="block"}});
    logoutButton.addEventListener("click",()=>{adminPassword="";passwordInput.value="";cards.innerHTML="";dashboard.style.display="none";loginView.style.display="block";loginError.style.display="none"});
  </script>
</body>
</html>
